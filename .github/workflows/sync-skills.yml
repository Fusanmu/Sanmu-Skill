name: Sync skills from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the collection
        uses: actions/checkout@v4

      - name: Download upstream skill repositories
        run: |
          mkdir -p /tmp/sanmu-skill-upstream
          git clone --depth 1 --branch main https://github.com/Fusanmu/keylol-post-converter.git /tmp/sanmu-skill-upstream/keylol-post-converter
          git clone --depth 1 --branch main https://github.com/Fusanmu/personal-game-review-prose.git /tmp/sanmu-skill-upstream/personal-game-review-prose
          git clone --depth 1 --branch main https://github.com/Fusanmu/interview-game-review.git /tmp/sanmu-skill-upstream/interview-game-review

      - name: Sync skill directories
        run: |
          mkdir -p skills/keylol-post-converter
          mkdir -p skills/personal-game-review-prose
          mkdir -p skills/interview-game-review

          rsync -a --delete --exclude='.git/' \
            /tmp/sanmu-skill-upstream/keylol-post-converter/keylol-post-converter/ \
            skills/keylol-post-converter/
          rsync -a --delete --exclude='.git/' \
            /tmp/sanmu-skill-upstream/personal-game-review-prose/ \
            skills/personal-game-review-prose/
          rsync -a --delete --exclude='.git/' \
            /tmp/sanmu-skill-upstream/interview-game-review/ \
            skills/interview-game-review/

          git diff --check

      - name: Commit synchronized changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/
          if git diff --cached --quiet; then
            echo "No upstream changes detected."
          else
            git commit -m "chore: sync skills from upstream"
            git push
          fi
